server {
    listen 80;
    server_name admin.realtypandit.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.realtypandit.in;

    root /var/www/admin/dist;
    index index.html;

    # SSL (configure your cert paths)
    ssl_certificate /etc/letsencrypt/live/admin.realtypandit.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.realtypandit.in/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # CSP — start in Report-Only, switch to enforcing after monitoring
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://maps.googleapis.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.realtypandit.in https://www.google-analytics.com https://maps.googleapis.com; font-src 'self' data:; frame-ancestors 'none'; report-uri /csp-report" always;

    # Service Worker — allow service-worker scope
    location /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
