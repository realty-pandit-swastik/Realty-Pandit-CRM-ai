  <body>
    <div id="root"></div>
    <script>
      // Force-clear stale service worker cache on first load after deploy.
      // This runs BEFORE React loads, so even if old SW serves broken JS, this fixes it.
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) {
              reg.update(); // Force check for new SW
            });
          });
          // Also clear old caches that might have stale vendor chunks
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) {
                if (name.includes('workbox-precache')) {
                  caches.delete(name);
                }
              });
            });
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
