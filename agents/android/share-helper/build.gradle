plugins { id 'com.android.application' }

android {
    namespace 'com.realtypandit.shareproof'
    compileSdk 34
    defaultConfig {
        applicationId 'com.realtypandit.mywhatsapp'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0-pilot'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('MY_WHATSAPP_KEYSTORE')) {
                storeFile file(System.getenv('MY_WHATSAPP_KEYSTORE'))
                storePassword System.getenv('MY_WHATSAPP_STORE_PASSWORD')
                keyAlias 'my-whatsapp'
                keyPassword System.getenv('MY_WHATSAPP_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
