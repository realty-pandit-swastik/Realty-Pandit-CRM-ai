// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlin_version = '1.9.20'
        compose_version = '1.5.4'
        compose_compiler_version = '1.5.4'
        hilt_version = '2.48'
        room_version = '2.6.0'
        retrofit_version = '2.9.0'
        work_version = '2.9.0'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        // GlitchTip / Sentry — Android Gradle plugin handles R8 mapping upload so
        // release-build stack traces are readable. Auth/org/project read from sentry.properties.
        classpath 'io.sentry:sentry-android-gradle-plugin:4.14.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
