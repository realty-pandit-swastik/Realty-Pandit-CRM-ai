name: Call Gateway CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'agents/call-gateway/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'agents/call-gateway/**'

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: agents/call-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agents/call-gateway/package-lock.json
      - run: npm ci
      - run: npm test
