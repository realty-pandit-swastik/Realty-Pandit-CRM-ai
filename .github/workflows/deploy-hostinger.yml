name: Deploy to Hostinger

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/backend/**'
      - 'agents/frontend/**'
      - 'agents/website/**'
      - 'agents/whatsapp-extension/**'
      - 'deploy/github-hostinger-release.sh'
      - '.github/workflows/deploy-hostinger.yml'
  push:
    branches: [main]
    paths:
      - 'agents/backend/**'
      - 'agents/frontend/**'
      - 'agents/website/**'
      - 'agents/whatsapp-extension/**'
      - 'deploy/github-hostinger-release.sh'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: 'Inspect production revision, processes, schema and backup metadata without deploying'
        required: true
        default: false
        type: boolean
      verify_backup:
        description: 'With preflight only: create database/uploads backup and restore-test the reviewed migrations in an isolated database'
        required: true
        default: false
        type: boolean
      run_migrations:
        description: 'Run prisma migrate deploy (requires a verified backup and migration review)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: ci-test-jwt-secret
      AGENT_JWT_SECRET: ci-test-agent-jwt-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agents/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: agents/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:personal-whatsapp
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  website-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/website
    env:
      NEXT_PUBLIC_API_URL: http://localhost:7071
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agents/website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  extension-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents/whatsapp-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: agents/whatsapp-extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: my-whatsapp-extension
          path: agents/whatsapp-extension/release/*.zip

  deploy:
    # Keep automatic delivery off until the server preflight in the handover is complete.
    if: github.ref == 'refs/heads/main' && (vars.HOSTINGER_GITHUB_DEPLOY_ENABLED == 'true' || inputs.preflight_only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-check, frontend-check, website-check, extension-check]
    environment: production
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
      HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment configuration
        run: |
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_PORT"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_PRIVATE_KEY"
          test -n "$HOSTINGER_KNOWN_HOSTS"
          test -n "$HOSTINGER_DEPLOY_PATH"

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Inspect production without deploying
        if: inputs.preflight_only
        run: |
          target="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          scp -P "$HOSTINGER_PORT" deploy/production-preflight.sh "$target:/tmp/production-preflight-${GITHUB_SHA}.sh"
          ssh -p "$HOSTINGER_PORT" "$target" "HOSTINGER_DEPLOY_PATH='$HOSTINGER_DEPLOY_PATH' bash /tmp/production-preflight-${GITHUB_SHA}.sh"

      - name: Back up and rehearse in isolated database
        if: inputs.preflight_only && inputs.verify_backup && !cancelled()
        run: |
          target="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          remote="/tmp/realty-production-backup-${GITHUB_SHA}"
          ssh -p "$HOSTINGER_PORT" "$target" "umask 077; mkdir -p '$remote'"
          scp -P "$HOSTINGER_PORT" deploy/production-backup.cjs "$target:$remote/production-backup.cjs"
          for migration in 20261008120000_lead_cycle_recycling 20261008130000_client_role; do
            ssh -p "$HOSTINGER_PORT" "$target" "mkdir -p '$remote/$migration'"
            scp -P "$HOSTINGER_PORT" "agents/backend/prisma/migrations/$migration/migration.sql" "$target:$remote/$migration/migration.sql"
          done
          ssh -p "$HOSTINGER_PORT" "$target" "HOSTINGER_DEPLOY_PATH='$HOSTINGER_DEPLOY_PATH' node '$remote/production-backup.cjs' '$remote/20261008120000_lead_cycle_recycling/migration.sql' '$remote/20261008130000_client_role/migration.sql'"

      - name: Package approved revision
        if: '!inputs.preflight_only'
        run: |
          tar -czf /tmp/realty-pandit-${GITHUB_SHA}.tgz \
            --exclude='agents/backend/node_modules' --exclude='agents/backend/.env' --exclude='agents/backend/uploads' --exclude='agents/backend/logs' \
            --exclude='agents/frontend/node_modules' --exclude='agents/frontend/dist' --exclude='agents/frontend/.env' \
            --exclude='agents/website/node_modules' --exclude='agents/website/.next' --exclude='agents/website/.env' --exclude='agents/website/.env.local' \
            agents/backend agents/frontend agents/website

      - name: Upload and deploy
        if: '!inputs.preflight_only'
        run: |
          target="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          archive="/tmp/realty-pandit-${GITHUB_SHA}.tgz"
          scp -P "$HOSTINGER_PORT" "$archive" "$target:$archive"
          scp -P "$HOSTINGER_PORT" deploy/github-hostinger-release.sh "$target:/tmp/github-hostinger-release.sh"
          ssh -p "$HOSTINGER_PORT" "$target" \
            "HOSTINGER_DEPLOY_PATH='$HOSTINGER_DEPLOY_PATH' bash /tmp/github-hostinger-release.sh preflight"
          ssh -p "$HOSTINGER_PORT" "$target" \
            "HOSTINGER_DEPLOY_PATH='$HOSTINGER_DEPLOY_PATH' bash /tmp/github-hostinger-release.sh deploy '$archive' '$GITHUB_SHA' '$RUN_MIGRATIONS'"

      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
